# Conda environment for MARFORCE-Flowtube
#   conda env create -f environment.yml
#   conda activate marforce
# Versions are the ones the examples were tested with.
name: marforce
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=2.0.2          # arrays
  - scipy=1.13.1         # sparse matrices, interpolation, constants
  - pandas=2.2.3         # input CSVs and result tables
  - numba=0.60.0         # compiled, parallel transport and chemistry kernels
  - matplotlib=3.9.4     # concentration plots
  - openbabel=3.1.1      # SMILES -> molecular properties (pybel)
  - xmltodict=0.14.2     # reading chemical_species_custom.xml
  - molmass=2024.10.25   # molar masses / diffusion coefficients from formulas
  - pip
  - pip:
      - numbalsoda==0.3.4  # LSODA stiff ODE solver callable from Numba
